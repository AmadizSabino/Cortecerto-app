name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Type check the Worker
        run: npx tsc --noEmit --strict --target es2022 --lib es2022,dom --module esnext --moduleResolution bundler ../worker/index.ts

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration in order
        run: |
          psql -v ON_ERROR_STOP=1 -q -c 'create database t'
          psql -v ON_ERROR_STOP=1 -q -d t -f supabase/tests/supabase_stub.sql
          for f in supabase/migrations/*.sql; do echo "$f"; psql -v ON_ERROR_STOP=1 -q -d t -f "$f"; done
      - name: Check the database rules
        run: psql -v ON_ERROR_STOP=1 -q -d t -f supabase/tests/scenarios.sql
      - name: The one-file bundle is up to date
        run: |
          ./scripts/bundle-migrations.sh
          git diff --exit-code -- supabase/pending || { echo "Run ./scripts/bundle-migrations.sh and commit the result."; exit 1; }
          test -z "$(git status --porcelain -- supabase/pending)"
      - name: The bundle applies on top of 0001 and 0002
        run: |
          psql -v ON_ERROR_STOP=1 -q -c 'create database b'
          psql -v ON_ERROR_STOP=1 -q -d b -f supabase/tests/supabase_stub.sql
          psql -v ON_ERROR_STOP=1 -q -d b -f supabase/migrations/0001_core.sql
          psql -v ON_ERROR_STOP=1 -q -d b -f supabase/migrations/0002_onboarding.sql
          psql -v ON_ERROR_STOP=1 -q -d b -f supabase/pending/0003_to_*.sql
          psql -v ON_ERROR_STOP=1 -q -d b -f supabase/tests/scenarios.sql
