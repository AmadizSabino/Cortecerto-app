<title>CorteCerto protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Bebas+Neue&display=swap">
<style>
/* Layout: a phone-sized app column centred on a quiet stage; sticky app bar at top, sticky tab bar at bottom; cards float on a cool grey ground */
:root{
  --stage:#E4E7EA; --bg:#F3F4F6; --surface:#FFFFFF; --raised:#FFFFFF; --ink:#0E1720; --muted:#5E6A74; --line:#E3E6EA;
  --accent:#0B6B66; --accent-ink:#FFFFFF; --soft:#E1EFEE; --flash:#D99A2B; --flash-soft:#FBF1DE; --bad:#B3402E; --good:#2D7A48;
  --shadow:0 1px 2px rgba(14,23,32,.05),0 10px 28px -14px rgba(14,23,32,.18);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#070C10; --bg:#0D141A; --surface:#151F27; --raised:#1A2630; --ink:#EAF0F3; --muted:#9AA8B2; --line:#24323C;
  --accent:#3DBBB2; --accent-ink:#04201E; --soft:#12302E; --flash:#F0B54D; --flash-soft:#33270F; --bad:#E58069; --good:#6CC28A;
  --shadow:0 0 0 1px var(--line); color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#070C10; --bg:#0D141A; --surface:#151F27; --raised:#1A2630; --ink:#EAF0F3; --muted:#9AA8B2; --line:#24323C;
  --accent:#3DBBB2; --accent-ink:#04201E; --soft:#12302E; --flash:#F0B54D; --flash-soft:#33270F; --bad:#E58069; --good:#6CC28A;
  --shadow:0 0 0 1px var(--line); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--stage)}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* demo controls, outside the app */
.demo-bar{max-width:440px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.switch{display:inline-grid;grid-template-columns:repeat(3,auto);background:var(--surface);border-radius:999px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.switch a{text-align:center;padding:6px 12px;white-space:nowrap;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px}
.switch a.on{background:var(--ink);color:var(--bg)}
.poster-wrap{display:flex;justify-content:center}
.poster{width:100%;max-width:340px;aspect-ratio:148/210;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 32px -12px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.08);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.po-top{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 16px 18px}
.po-mo{position:absolute;right:-18px;top:-20px;opacity:.45}
.po-mo svg{width:120px;height:120px;stroke-width:1.1}
.po-logo{position:relative;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:24px;font-weight:700;overflow:hidden;border:3px solid}
.po-logo img{width:100%;height:100%;object-fit:cover}
.po-name{position:relative;font-size:24px;line-height:1.1}
.po-tag{position:relative;font-size:11px;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.po-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:12px 18px}
.po-head{margin:0;font-size:21px;line-height:1.15;font-weight:700;text-wrap:balance}
.po-stars{margin:-4px 0 0;font-size:18px;letter-spacing:.15em}
.po-qr{background:#fff;padding:8px;border-radius:14px;width:46%}
.po-qr svg{display:block;width:100%;height:auto}
.po-qr svg,.po-qr svg *{stroke:none!important}
.po-hint{margin:0;font-size:11px}
.po-url{margin:0;font:600 11.5px var(--body);border-radius:999px;padding:5px 12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po-foot{margin:0;text-align:center;font-size:9.5px;padding:0 0 10px;opacity:.8}
[data-font="bold"] .po-name,[data-font="bold"] .po-head{font-weight:400}
#print-root{display:none}
@media print{
  @page{size:A5 portrait;margin:0}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  #print-root .poster{width:148mm;height:210mm;max-width:none;aspect-ratio:auto;border-radius:0;box-shadow:none}
  #print-root .po-top{padding:14mm 10mm 10mm;gap:3mm}
  #print-root .po-mo svg{width:70mm;height:70mm}
  #print-root .po-name{font-size:34pt}#print-root .po-tag{font-size:11pt}#print-root .po-head{font-size:26pt}
  #print-root .po-logo{width:28mm;height:28mm;font-size:28pt;border-radius:8mm}
  #print-root .po-hint,#print-root .po-url{font-size:12pt}#print-root .po-stars{font-size:24pt}#print-root .po-foot{font-size:9pt;padding-bottom:6mm}
}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tp{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-radius:18px;padding:5px;border:2px solid transparent;min-width:0}
.tp.on{border-color:var(--accent)}
.tp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tp-ph{display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:6px;box-shadow:0 0 0 1px rgba(0,0,0,.1);overflow:hidden}
.tp-cv{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;border-radius:10px;padding:8px;aspect-ratio:4/3;overflow:hidden}
.tp-cv b{font-size:15px;line-height:1.1;position:relative;overflow-wrap:anywhere}
.tp-cv small{font-size:9.5px;opacity:.85;position:relative;line-height:1.2}
.tp-mo{position:absolute;right:-6px;top:-8px;opacity:.6}
.tp-mo svg{width:56px;height:56px;stroke-width:1.4}
.tp-btn{border-radius:999px;font:600 10px var(--body);text-align:center;padding:5px}
.tp-row{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tp-row i{height:20px;border-radius:7px;border:1px solid}
.tp-name{font:600 12.5px var(--body);color:var(--ink);padding:0 2px}
.tp-dots{display:flex;gap:4px;padding:0 2px}
.tp-dots i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px rgba(128,128,128,.35)}
.kind{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--raised);color:var(--ink)}
.kind.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kind:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kind .ob-ico{width:46px;height:46px;flex:none}
.hero .cover.themed{position:relative;display:flex;align-items:flex-end;padding:18px 18px 46px;overflow:hidden}
.cv-mo{position:absolute;right:-14px;top:-18px;opacity:.5}
.cv-mo svg{width:150px;height:150px;stroke-width:1.1}
.cv-tag{position:relative;margin:0;font-family:var(--display);font-size:24px;line-height:1.1;max-width:72%;font-weight:700;text-wrap:balance}
[data-font="bold"] h1,[data-font="bold"] h2,[data-font="bold"] h3,[data-font="bold"] .cv-tag{font-weight:400;letter-spacing:.02em}
[data-font="bold"] h1{font-size:32px}
[data-font="bold"] .cv-tag{font-size:30px}
[data-font="serif"] h1,[data-font="serif"] h2,[data-font="serif"] h3{letter-spacing:-.01em;font-weight:700}
.preview-bar{background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.preview-bar .btn{background:var(--bg);color:var(--ink)}
label.ck{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400}
label.ck input{margin-top:1px}
.sum{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--bg);border-radius:14px}
details{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--raised)}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.legal{font-size:12.5px;color:var(--muted);line-height:1.5;max-height:240px;overflow:auto;margin-top:10px}
.legal p{margin:0 0 8px}
.ob-steps{padding:2px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.otp{font-size:24px;letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums}
.card.plan.sel{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.qr{display:grid;place-items:center;padding:12px;background:#fff;border-radius:16px;align-self:center;box-shadow:inset 0 0 0 1px var(--line)}
.qr svg{width:168px;height:168px;display:block}
.qr svg,.qr svg *{stroke:none!important}
.ob-ico{width:52px;height:52px;border-radius:16px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:26px;font-weight:700;line-height:1}
.ob-ico svg{width:26px;height:26px}
.ob-ico.done{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.lbl{margin:0 0 6px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--muted);font:500 13px var(--body);text-decoration:underline;cursor:pointer;padding:6px}
.demo-note{font-size:12px;color:var(--muted);text-align:center;max-width:440px;margin:14px auto 28px;padding-left:16px;padding-right:16px}

/* the app column */
.app{max-width:440px;margin:0 auto;background:var(--bg);min-height:calc(100vh - 60px);position:relative}
@media (min-width:480px){.app{border-radius:32px;box-shadow:0 30px 80px -30px rgba(10,20,30,.35)}}
#app{display:flex;flex-direction:column;min-height:inherit}
.stack{display:flex;flex-direction:column;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));flex:1}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-radius:inherit}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin:0}
.tabbar{position:sticky;bottom:0;z-index:6;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
@media (min-width:480px){.tabbar{border-radius:0 0 32px 32px}}
.tabbar button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font:600 11px var(--body);cursor:pointer;border-radius:14px}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--accent)}
.tabbar button.on svg{stroke-width:2.2}
.segctl{display:flex;gap:4px;margin:4px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--line);padding:3px;border-radius:14px}
.segctl button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:8px 6px;border-radius:11px;cursor:pointer}
.segctl button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}

/* client hero */
.hero{position:relative;padding:0 0 4px}
.hero .cover{display:block;width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:inherit}
.hero .cover.pattern{background:
  radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--accent) 55%,transparent) 0%,transparent 60%),
  repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--ink)) 0 14px,color-mix(in srgb,var(--accent) 10%,var(--ink)) 14px 28px)}
@media (min-width:480px){.hero .cover{border-radius:32px 32px 0 0}}
.hero-row{position:relative;z-index:1;display:flex;align-items:flex-end;gap:12px;margin-top:0;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.hero-row .avatar{width:72px;height:72px;border-radius:22px;font-size:26px;border:4px solid var(--bg);margin-top:-36px;flex:none}
.hero-txt{flex:1;min-width:0;padding-top:10px;align-self:flex-start}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.lang{width:auto!important;padding:6px 10px!important;font-size:13px!important;border-radius:999px!important;margin-bottom:6px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0}

/* type */
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.025em;text-wrap:balance}
h1{font-size:27px;font-weight:800;line-height:1.08}
h2{font-size:19px;font-weight:700;line-height:1.2}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.sm{font-size:13px}

/* surfaces */
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.shop{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:15px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 18px var(--display);flex:none;overflow:hidden}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line);transition:background .3s}
.steps span.on{background:var(--accent)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--raised);color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.99)}
.opt b{font-weight:600;font-size:16px}
.opt.on{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt small{color:var(--muted)}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--raised);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 13.5px var(--body);cursor:pointer;transition:background .15s,border-color .15s}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{border:1.5px solid var(--line);background:var(--raised);color:var(--ink);border-radius:16px;padding:10px 4px;text-align:center;font:inherit;cursor:pointer}
.day b{display:block;font:700 19px var(--display);font-variant-numeric:tabular-nums}
.day small{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.on small{color:var(--bg);opacity:.75}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slots .chip{padding:10px 4px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}

/* buttons */
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 22px;min-height:48px;font:600 15px var(--body);cursor:pointer;text-decoration:none;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{padding:8px 14px;min-height:36px;font-size:13px}
.btn.bad{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.flash{background:var(--flash);color:#1B1200}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.card > .row.end{margin-top:4px}
.card > .row.end .btn:not(.small){flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}

/* forms */
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
input,select,textarea{font:16px var(--body);padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input[type="checkbox"]{width:20px!important;height:20px;accent-color:var(--accent);flex:none;padding:0}
input[type="file"]{padding:10px;font-size:13px;background:var(--bg);border-style:dashed}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:3px solid var(--flash);outline-offset:2px}

/* try-on */
.tryon{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frame{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:var(--soft);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);padding:8px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .tag{position:absolute;left:8px;bottom:8px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(6px);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700}
.frame .shade{position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 60%,transparent) 0%,transparent 40%)}
.frame .shade.beard{background:linear-gradient(0deg,rgba(55,35,20,.6) 0%,rgba(55,35,20,.25) 28%,rgba(55,35,20,0) 42%)}
.frame .shade.brows{background:linear-gradient(180deg,transparent 26%,rgba(55,35,20,.5) 32%,rgba(55,35,20,.5) 35%,transparent 41%)}
.frame .shade.nail{background:linear-gradient(0deg,rgba(200,60,110,.45) 0%,rgba(200,60,110,0) 45%)}

/* notes, callouts */
.note{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px;line-height:1.45}
.mbway{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.done{text-align:center;align-items:center;padding-block:28px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 28px var(--display);box-shadow:0 10px 30px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
@media (prefers-reduced-motion:no-preference){.tick{animation:pop .45s cubic-bezier(.2,1.4,.4,1)} @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}}
.offer{background:var(--soft);border-radius:18px;padding:14px 16px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.offer b{font-size:14.5px}
.offer.flashy{background:var(--flash-soft)}

/* data */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:14px 16px;min-width:0;box-shadow:var(--shadow)}
.card .stat{box-shadow:none;background:var(--bg)}
.stat b{display:block;font:800 28px var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}
.stat small{color:var(--muted);font-size:12px;font-weight:500}
.stat.hi{background:var(--ink);color:var(--bg)}
.stat.hi small{color:var(--bg);opacity:.7}
.appt{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.appt:first-of-type{border-top:0}
.appt .t{font:700 16px var(--display);font-variant-numeric:tabular-nums;padding-top:1px}
.appt .who{display:flex;flex-direction:column;gap:5px;min-width:0;border-left:3px solid var(--accent);padding-left:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}
.pill.dep{background:var(--bg);color:var(--muted)}
.pill.pro{background:var(--flash-soft);color:var(--ink)}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.list-item:first-of-type{border-top:0}
.list-item > div{min-width:0}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{border-radius:18px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);min-width:0}
.prod .ph{aspect-ratio:1;background:var(--soft);display:grid;place-items:center;position:relative}
.prod .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prod .ph svg{width:46%;height:46%;stroke:none}
.prod .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:8px}
.voucher{border-radius:20px;padding:20px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--ink)));color:var(--accent-ink);display:flex;flex-direction:column;gap:4px}
.voucher b{font:800 34px var(--display)}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;max-width:min(400px,calc(100% - 32px));text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:no-preference){.stack > *{animation:rise .28s ease-out both} @keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>

const FORM_Q={
  depil:[["sens","Tenho a pele sensível ou irritada na zona"],["retin","Uso retinóides ou tomei isotretinoína nos últimos 6 meses"],["preg","Estou grávida"]],
  cor:[["patch","Fiz o teste de alergia nas últimas 48 horas"],["prev","Já tive reação a uma coloração"],["hen","Tenho henna ou outra tinta no cabelo"]]
};
function formKind(id){if(!id||!S.forms)return "";const s=svc(id);if(s.cat==="depil"&&S.forms.depil)return "depil";if(id==="coloracao"&&S.forms.cor)return "cor";return ""}
const onlyD=v=>String(v||"").replace(/\D/g,"");
function policyText(){const P=S.policy;return LANG==="en"?`Cancel or move up to ${P.cancelH} h before and the deposit is refunded. After ${P.late} minutes late, the slot may go to the next client.`:`Desmarca ou muda até ${P.cancelH} h antes e o sinal é devolvido. Com mais de ${P.late} minutos de atraso, a vaga pode passar para o cliente seguinte.`}
function policyBox(){return `<div class="note"><b>${LANG==="en"?"Salon rules":"Regras do salão"}</b><br>${policyText()}${S.policy.extra?"<br>"+esc(S.policy.extra):""}</div>`}
function formHtml(k){if(!k)return "";const F=C.form||{};
  if(S.forms.done[onlyD(C.phone)+":"+k])return `<p class="note">${LANG==="en"?"Your health form is already on file.":"A tua ficha de saúde já está registada."}</p>`;
  return `<div class="mbway"><b>${LANG==="en"?"Health form":"Ficha de saúde"}</b><p class="muted sm" style="margin:0">${LANG==="en"?"Only the salon sees this. It keeps you safe.":"Só o salão vê. Serve para a tua segurança."}</p>
    ${FORM_Q[k].map(([q,l])=>`<label class="ck"><input type="checkbox" data-fq="${q}" ${F[q]?"checked":""}><span class="sm">${l}</span></label>`).join("")}
    <label>${LANG==="en"?"Allergies or medication":"Alergias ou medicação"}<input id="f-all" value="${esc(F.all||"")}" placeholder="${LANG==="en"?"None":"Nenhuma"}"></label>
    <label class="ck"><input type="checkbox" id="f-ok" ${F.ok?"checked":""}><span class="sm">${LANG==="en"?"The information is true and I agree to the treatment (required).":"Confirmo que a informação é verdadeira e aceito o tratamento (obrigatório)."}</span></label></div>`}
function keepForm(){const r=document;if(!r.getElementById("f-ok"))return;C.form=C.form||{};r.querySelectorAll("[data-fq]").forEach(i=>C.form[i.dataset.fq]=i.checked);C.form.all=r.getElementById("f-all").value;C.form.ok=r.getElementById("f-ok").checked}
function formPills(x){if(!x.form)return "";const k=x.form.kind,warn=FORM_Q[k].filter(([q])=>x.form[q]&&q!=="patch").map(([q,l])=>l);const noPatch=k==="cor"&&!x.form.patch;
  return `<small class="note"><b>Ficha de saúde:</b> ${warn.length||noPatch||x.form.all?[...warn,noPatch?"Ainda não fez o teste de alergia":"",x.form.all?"Alergias: "+esc(x.form.all):""].filter(Boolean).join(" · "):"Sem alertas"}</small>`}
function myPack(svcId,phone){const ph=onlyD(phone);return S.clientPacks.find(c=>onlyD(c.phone)===ph&&c.left>0&&(S.packs.find(p=>p.id===c.pack)||{}).svc===svcId)}
function nextDate(x){const d=new Date(x.day+"T12:00:00");d.setDate(d.getDate()+(INTERVAL[x.service]||28));if(d.getDay()===0)d.setDate(d.getDate()+1);return iso(d)}
function rebookHtml(x){if(x.status!=="concluido"||x.family)return "";if(x.rebooked)return `<small class="muted">Próxima visita: ${esc(x.rebooked)}</small>`;
  const nd=nextDate(x);return `<div class="offer"><span class="sm"><b>Marcar já a próxima?</b> ${first(x.name)} costuma voltar a cada ${INTERVAL[x.service]||28} dias: ${fmtDay(nd)} às ${x.time}.</span><div class="row"><button class="btn small" data-rebook="${x.id}">Marcar</button><a class="btn ghost small" target="_blank" rel="noopener" data-rbwa="${x.id}" href="${wa(x.phone,`Olá ${first(x.name)}! Obrigado pela visita. Queres já marcar a próxima para ${fmtDay(nd)} às ${x.time}? Marca aqui: cortecerto.pt/${slugify(SHOP.name)}`)}">Sugerir por WhatsApp</a></div></div>`}
function queueWait(n){return n*S.queue.avg}

  return `<div class="card"><div class="between"><h2>Fila ao vivo</h2><span class="pill">${Q.list.length} à espera · ~${queueWait(Q.list.length)} min</span></div>
    <p class="muted sm" style="margin:0">Quem chega sem marcação entra na fila pelo cartaz QR e recebe um WhatsApp quando estiver quase.</p>
    <div>${Q.list.length?Q.list.map((q,i)=>`<div class="list-item"><div><b>${i+1}. ${esc(q.name)}</b><br><small class="muted">${esc(svc(q.service).name)} · entrou às ${q.at}${q.called?" · chamado":""}</small></div><div class="row" style="flex:none;gap:4px"><a class="btn ${q.called?"ghost":""} small" target="_blank" rel="noopener" data-qcall="${q.id}" href="${wa(q.phone,`Olá ${first(q.name)}, é quase a tua vez na ${SHOP.name}. Vem já, por favor.`)}">${q.called?"Chamar outra vez":"Chamar"}</a><button class="btn ghost small" data-qdone="${q.id}" aria-label="Atendido">✓</button></div></div>`).join(""):`<p class="empty">Ninguém na fila.</p>`}</div>

function taken(day){
  const set=new Set();
  S.bookings.filter(x=>x.day===day&&x.status!=="cancelado").forEach(x=>{
    const tr=x.home?Math.ceil((x.home.travel||0)/15)*15:0,st=toMin(x.time)-tr,len=svc(x.service).min+2*tr;
    for(let m=st;m<st+len;m+=15)set.add(m);
  });
  return set;
}
function freeSlots(day,service,travel=0){
  const len=svc(service).min,tk=taken(day),out=[];travel=Math.ceil(travel/15)*15;
  const now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
  for(let m=OPEN*60;m+len<=CLOSE*60;m+=30){
    let ok=m-travel>=OPEN*60&&m+len+travel<=CLOSE*60;for(let k=m-travel;k<m+len+travel;k+=15)if(tk.has(k)){ok=false;break}
    if(day===TODAY&&m<=nowMin)ok=false;
    out.push({t:toT(m),ok});
  }
  return out;
}

  if(C.styleOpen)bindGallery(root,id=>{if(C.preview)C.preview.theme=id;else{S.myTheme=id;save()}render();toast((LANG==="en"?"Style ":"Estilo ")+themeById(id).name)},f=>{C.gfilter=f;render()});

  const on=(id,fn)=>{const el=root.querySelector("#"+id);if(el)el.onclick=fn};
  root.querySelector("#lang").onchange=e=>{LANG=e.target.value;render()};
  root.querySelectorAll("[data-ctab]").forEach(b=>b.onclick=()=>{C.tab=b.dataset.ctab;render();window.scrollTo(0,0)});
  root.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{C.cat=b.dataset.cat;C.service=null;C.cut="";render()});
  root.querySelectorAll("[data-svc]").forEach(b=>b.onclick=()=>{C.service=b.dataset.svc;C.time=null;C.cut="";render()});
  root.querySelectorAll("[data-cut]").forEach(b=>b.onclick=()=>{const c=b.dataset.cut;if(C.multi){if(C.compare.includes(c))C.compare=C.compare.filter(x=>x!==c);else if(C.compare.length<3)C.compare.push(c);else toast(LANG==="en"?"Up to 3 styles.":"No máximo 3 estilos.")}else C.cut=C.cut===c?"":c;render()});

  on("tovote",()=>{C.votes={};C.step=8;render()});
  on("voteback",()=>{C.step=2;render()});
  root.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>toast((LANG==="en"?"In the real version this opens ":"Na versão real, abre o ")+b.dataset.share+(LANG==="en"?" with the image and a vote sticker.":" com a imagem e um sticker de votação.")));
  on("copypoll",()=>{const txt=(LANG==="en"?"Which one suits me? ":"Qual me fica melhor? ")+C.compare.map((c,i)=>"ABC"[i]+": "+c).join(" / ");try{navigator.clipboard.writeText(txt).then(()=>toast(LANG==="en"?"Copied. Paste it into the poll sticker.":"Copiado. Cola no sticker de sondagem."),()=>toast(txt))}catch(e){toast(txt)}});
  on("simvote",()=>{C.compare.forEach(c=>C.votes[c]=(C.votes[c]||0)+Math.floor(Math.random()*6));render()});
  on("pickwin",()=>{const w=C.compare.slice().sort((a,b)=>(C.votes[b]||0)-(C.votes[a]||0))[0];C.cut=w;C.multi=false;C.step=3;render()});

function botReply(msg){const m=msg.toLowerCase().trim();

function member(id){return S.team.find(m=>m.id===id)}
function priceFor(svcId,staffId){const m=staffId&&member(staffId);const p=m&&m.prices&&m.prices[svcId];return p!=null&&p!==""?Number(p):svc(svcId).price}

function payLine(m){
  if(m.pay==="comissao"){const c=m.month*m.pct/100+m.prod*m.prodPct/100;return {txt:`${m.pct}% dos serviços${m.prodPct?" · "+m.prodPct+"% dos produtos":""}`,due:c+m.tips,detail:`Serviços ${eur(m.month)} × ${m.pct}% = ${eur(m.month*m.pct/100)}${m.prodPct?` · produtos ${eur(m.prod)} × ${m.prodPct}% = ${eur(m.prod*m.prodPct/100)}`:""} · gorjetas ${eur(m.tips)}`}}
  if(m.pay==="aluguer")return {txt:`Aluga por ${eur(m.rent)}/mês`,due:-m.rent,detail:"Fica com o que fatura e com os seus clientes. Paga a renda ao salão."};
  if(m.pay==="fixo")return {txt:`Ordenado de ${eur(m.salary)}/mês`,due:m.salary+m.tips,detail:`Ordenado ${eur(m.salary)} · gorjetas ${eur(m.tips)}`};

}

function bindTeam(root){
  const on=(id,fn)=>{const el=root.querySelector("#"+id);if(el)el.onclick=fn};
  on("staddnew",()=>{B.staffEdit={id:"",name:"",phone:"",role:"Barbeiro/a",pay:"comissao",pct:40,prodPct:10,rent:300,salary:870,svc:{},prices:{},days:[1,2,3,4,5,6],book:true,month:0,prod:0,tips:0,paid:true};render();window.scrollTo(0,0)});
  root.querySelectorAll("[data-stedit]").forEach(b=>b.onclick=()=>{B.staffEdit=JSON.parse(JSON.stringify(member(b.dataset.stedit)));render();window.scrollTo(0,0)});
  root.querySelectorAll("[data-rent]").forEach(b=>b.onclick=()=>{const m=member(b.dataset.rent);if(m)m.paid=true;save();render();toast("Renda registada.")});
  on("stexport",()=>toast("Na versão real, enviamos um PDF com as comissões e as rendas do mês para o e-mail do contabilista."));
  const E=B.staffEdit;if(!E)return;
  const read=()=>{const g=id=>root.querySelector("#"+id);const num=(id,d)=>{const el=g(id);if(!el)return d;const v=parseFloat(String(el.value).replace(",","."));return v>=0?v:d};
    E.name=g("st-name").value.trim();E.phone=g("st-phone").value;E.role=g("st-role").value;E.pct=Math.min(100,num("st-pct",E.pct));E.prodPct=Math.min(100,num("st-ppct",E.prodPct));E.rent=num("st-rent",E.rent);E.salary=num("st-sal",E.salary);E.book=g("st-book").checked;
    root.querySelectorAll("[data-stsvc]").forEach(i=>{E.svc[i.dataset.stsvc]=i.checked});
    root.querySelectorAll("[data-stprice]").forEach(i=>{const v=String(i.value).trim().replace(",",".");if(v===""||isNaN(Number(v)))delete E.prices[i.dataset.stprice];else E.prices[i.dataset.stprice]=Number(v)})};
  root.querySelectorAll("[data-stpay]").forEach(b=>b.onclick=()=>{read();E.pay=b.dataset.stpay;render()});
  root.querySelectorAll("[data-stday]").forEach(b=>b.onclick=()=>{read();const d=Number(b.dataset.stday);E.days=E.days.includes(d)?E.days.filter(x=>x!==d):E.days.concat(d);render()});
  on("stcancel",()=>{B.staffEdit=null;render()});
  on("stdel",()=>{S.team=S.team.filter(m=>m.id!==E.id);B.staffEdit=null;save();render();toast("Profissional removido. As marcações antigas ficam guardadas.")});
  on("stsave",()=>{read();if(E.name.length<2){toast("Indica o nome.");return}
    if(E.id){const i=S.team.findIndex(m=>m.id===E.id);S.team[i]=E;toast("Guardado.")}else{E.id="t-"+uid();S.team.push(E);toast("Adicionado. Enviámos um SMS a "+E.name+" para entrar na app.")}
    B.staffEdit=null;save();render()});
}

function bindInvoice(root){
  const I=S.inv;if(!I||!root.querySelector("#invcard"))return;
  const g=id=>root.querySelector("#"+id);
  const keep=()=>{if(g("inv-key"))I.key=g("inv-key").value.trim();if(g("inv-auto"))I.auto=g("inv-auto").checked;if(g("inv-nif"))I.askNif=g("inv-nif").checked};
  root.querySelectorAll("[data-invmode]").forEach(b=>b.onclick=()=>{keep();I.mode=b.dataset.invmode;save();render()});
  root.querySelectorAll("[data-invpick]").forEach(b=>b.onclick=()=>{I.mode="ligar";I.prov=b.dataset.invpick;I.ok=false;save();render();toast("Agora cola a chave da API.")});
  if(g("inv-prov"))g("inv-prov").onchange=()=>{keep();I.prov=g("inv-prov").value;I.ok=false;save();render()};
  ["inv-auto","inv-nif"].forEach(id=>{if(g(id))g(id).onchange=()=>{keep();save()}});
  if(g("inv-test"))g("inv-test").onclick=()=>{keep();if(I.key.length<6){toast("Cola a chave da API do teu programa.");return}I.ok=true;save();render();toast("Ligação feita. Fatura de teste criada e anulada no teu programa.")};
}

function shrink(file,max,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",0.82))};img.src=r.result};r.readAsDataURL(file)}

function obGo(n){R.step=n;render();window.scrollTo(0,0)}
function applySignup(){
  S=sample();
  Object.assign(S.salon,{name:R.name.trim(),nif:onlyDigits(R.nif),wa:fmtPhone(R.waSame?R.phone:R.wa),mbphone:fmtPhone(R.mbSame?R.phone:R.mb),terms:true,dpa:true,news:!!R.news,done:true,type:R.type,city:R.city,hours:R.hours});
  S.services.forEach(x=>{const v=R.svc[x.id];if(v){x.on=v.on;x.price=Number(String(v.price).replace(",","."))||x.price}else x.on=false});
  S.deposit=Number(R.deposit);
  S.home=homeDefaults(R.home||"nao");if(R.home==="so")S.services.forEach(x=>{if(x.on)S.home.svc[x.id]=true});else S.home.svc={};if(R.home==="tambem")S.services.forEach(x=>{if(x.on&&["corte","barba","combo","crianca","gel","pedicure","pernas","meiaperna","axilas","sobrancelhas"].includes(x.id))S.home.svc[x.id]=true});
  S.look={client:R.theme,panel:R.same?R.theme:"cortecerto",same:!!R.same};
  S.sub={plan:R.plan,ai:R.ai,method:R.method,mbpay:R.mbpay,iban:R.iban,bname:R.bname,nif:R.nif,bemail:R.bemail,emailOk:!!R.emailOk,trialEnd:iso(addDays(30))};
  save();
}
function bindGallery(root,onPick,onFilter){
  root.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>onPick(b.dataset.pick));
  root.querySelectorAll("[data-gfilter]").forEach(b=>b.onclick=()=>onFilter(b.dataset.gfilter));
}
function bindSignup(root){
  const rer=()=>render();
  bindFields(root,R,rer);
  root.querySelectorAll("[data-obgo]").forEach(b=>b.onclick=()=>obGo(Number(b.dataset.obgo)));
  const on=(id,f)=>{const el=root.querySelector("#"+id);if(el)el.onclick=f};
  on("obback",()=>obGo(R.step===4?2:R.step-1));
  on("oblogin",()=>toast("No protótipo, abre o painel em Salão, no topo."));
  const sendCode=()=>{R.sent=String(Math.floor(100000+Math.random()*900000));R.code="";toast("SMS: o teu código CorteCerto é "+R.sent)};
  on("obsend",()=>{if(!okPhone(R.phone)){toast("Indica um telemóvel português com 9 dígitos.");return}if(!okEmail(R.email)){toast("Indica um e-mail válido.");return}sendCode();obGo(3)});
  on("obresend",()=>{sendCode();render()});
  on("obverify",()=>{if(onlyDigits(R.code)!==R.sent){toast("O código não está certo. Tenta de novo.");return}toast("Número confirmado.");if(!R.bemail)R.bemail=R.email;obGo(4)});
  root.querySelectorAll("[data-obtype]").forEach(b=>b.onclick=()=>{const k=b.dataset.obtype;if(k!==R.type){R.type=k;R.svc={};R.gfilter=k==="misto"?"todos":k;if(!R.themePicked)R.theme=KIND_DEFAULT[k]}render()});
  root.querySelectorAll("[data-obhome]").forEach(b=>b.onclick=()=>{R.home=b.dataset.obhome;render()});
  on("obsalon",()=>{if(String(R.name).trim().length<2){toast("Indica o nome do salão.");return}if(!R.bname)R.bname=R.name.trim();obGo(6)});
  root.querySelectorAll("[data-obsvc]").forEach(i=>i.onchange=()=>{R.svc[i.dataset.obsvc].on=i.checked});
  root.querySelectorAll("[data-obprice]").forEach(i=>i.oninput=()=>{R.svc[i.dataset.obprice].price=i.value});
  on("obsvc",()=>{const list=SERVICES.filter(x=>TYPE_CATS[R.type].includes(x.cat));if(!list.some(x=>R.svc[x.id]&&R.svc[x.id].on)){toast("Escolhe pelo menos um serviço.");return}obGo(7)});
  bindGallery(root,id=>{R.theme=id;R.themePicked=true;render()},f=>{R.gfilter=f;render()});
  on("obpay",()=>{if(!R.waSame&&!okPhone(R.wa)){toast("Indica o WhatsApp do salão, com 9 dígitos.");return}if(!R.mbSame&&!okPhone(R.mb)){toast("Indica o número MB Way, com 9 dígitos.");return}if(!R.numsOk){toast("Autoriza a CorteCerto a guardar os números para continuar.");return}if(!R.mbpay)R.mbpay=R.mbSame?R.phone:R.mb;obGo(9)});
  root.querySelectorAll("[data-obplan]").forEach(b=>b.onclick=()=>{R.plan=b.dataset.obplan;obGo(10)});
  if(R.step===10)bindCheckout(root,R,()=>{obGo(11);toast("Conta criada. Bem-vindo à CorteCerto!")},rer);
  on("obcopy",()=>{try{navigator.clipboard.writeText("https://cortecerto.pt/"+slugify(R.name)).catch(()=>{})}catch(e){}toast("Link copiado.")});
  on("obqr",()=>{R.showPoster=!R.showPoster;render()});
  on("p-print",printPoster);
  on("obemail",()=>{R.emailOk=true;render();toast("E-mail confirmado.")});
  on("obopen",()=>{applySignup();B={tab:"hoje",day:TODAY,offer:null,card:null,promoSlot:null,promoOff:20};location.hash="#barbeiro";window.scrollTo(0,0)});
  on("obagain",()=>{R=newSignup();obGo(1)});
}

const POSTER_HEADS={queue:["Entra na fila pelo telemóvel","Sem esperar ao balcão: entra na fila","Vê quantos estão à tua frente"],book:["Marca a tua próxima visita","Sem esperas: marca pelo telemóvel","Marca já, em 30 segundos"],review:["Gostaste? Deixa-nos uma avaliação","A tua opinião ajuda-nos a crescer","Avalia-nos no Google"]};
const okGoogleReview=v=>/^https:\/\/(g\.page\/r\/|search\.google\.com\/local\/writereview|www\.google\.[a-z.]+\/maps|maps\.app\.goo\.gl\/|g\.co\/kgs\/)/i.test(String(v||"").trim());
function posterHtml(o){
  const t=themeById(o.theme),dark=t.mode==="dark"||t.id==="cortecerto",coverInk=dark?"#fff":t.ink;
  const kindTag=o.kind==="review"?"":(KIND_TAG[o.type]||KIND_TAG.misto);

  const short=o.kind==="review"?"Avaliação no Google":String(o.url).replace(/^https?:\/\//,"");
  return `<div class="poster" id="poster" role="img" aria-label="Cartaz ${o.kind==="review"?"de avaliações":o.kind==="queue"?"da fila":"de marcações"} de ${esc(o.name)}" style="background:${t.bg};color:${t.ink}">
    <div class="po-top" style="background:linear-gradient(160deg,${t.c[0]},${t.c[1]});color:${coverInk}">
      <span class="po-mo" style="color:${t.accent}">${MOTIF[t.motif]}</span>
      <div class="po-logo" style="background:${t.accent};color:${t.accentInk};border-color:${t.bg}">${logo}</div>
      <b class="po-name" style="font-family:${FONT_STACK[t.font]}">${esc(o.name||"O teu salão")}</b>
      ${kindTag?`<small class="po-tag">${esc(kindTag)}</small>`:""}
    </div>
    <div class="po-body">
      <p class="po-head" style="font-family:${FONT_STACK[t.font]}">${esc(o.headline)}</p>
      ${o.kind==="review"?`<p class="po-stars" style="color:${t.accent}">★★★★★</p>`:""}
      <div class="po-qr" style="box-shadow:0 0 0 3px ${t.accent}">${qrSvg(o.url)}</div>
      <p class="po-hint" style="color:${t.muted}">Aponta a câmara do telemóvel ao código</p>
      <p class="po-url" style="background:${t.accent};color:${t.accentInk}">${esc(short)}</p>
    </div>
    <p class="po-foot" style="color:${t.muted}">Feito com CorteCerto</p></div>`;
}

function view(){const x=location.hash;return x==="#barbeiro"?"barbeiro":x==="#registo"?"registo":"cliente"}
function render(){
  const v=view(),root=document.getElementById("app");
  SHOP.name=(S.salon&&S.salon.name)||"Barbearia do Bairro";
  if(v==="barbeiro")C.preview=null;
  applyTheme(viewTheme(v));
  const rs=document.documentElement.style,col=v!=="registo"&&S.brand&&S.brand.color;
  if(col){rs.setProperty("--accent",col);rs.setProperty("--accent-ink","#FFFFFF");rs.setProperty("--soft","color-mix(in srgb, "+col+" 16%, var(--bg))")}
  document.getElementById("tab-cliente").classList.toggle("on",v==="cliente");
  document.getElementById("tab-barbeiro").classList.toggle("on",v==="barbeiro");
  document.getElementById("tab-registo").classList.toggle("on",v==="registo");
  if(v==="cliente"){root.innerHTML=clientView();bindClient(root)}else if(v==="registo"){root.innerHTML=signupView();bindSignup(root)}else{root.innerHTML=barberView();bindBarber(root)}
}
